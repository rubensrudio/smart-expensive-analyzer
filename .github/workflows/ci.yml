# CI (TASK-031; SEA-04): lint, typecheck e testes unit + integration contra PostgreSQL real.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Credenciais efêmeras do banco de teste do runner, não são segredos.
          POSTGRES_USER: sea
          POSTGRES_PASSWORD: sea
          POSTGRES_DB: sea_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sea -d sea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . --output-format=concise

      - name: Typecheck (mypy)
        run: mypy app

      - name: Testes (pytest)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sea:sea@localhost:5432/sea_test
        run: pytest -q

      - name: Publicar relatório JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem da API
        run: |
          cp .env.example .env
          docker compose build api
